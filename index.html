<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Walker Clem. Engineer.">
    <meta name="color-scheme" content="dark">
    <meta name="referrer" content="no-referrer">
    <title>Walker Clem — Engineer</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; color: #fff; background: #18110d; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100svh; display: flex; align-items: flex-end; padding: clamp(24px, 5vw, 80px); }
      .photo { position: fixed; inset: 0; z-index: 0; display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; pointer-events: none; }
      body::before { content: ""; position: fixed; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(0deg, rgb(12 9 8 / 88%), rgb(12 9 8 / 18%) 70%, rgb(12 9 8 / 10%)); }
      main { --portrait-size: clamp(64px, 8vw, 96px); --identity-gap: clamp(16px, 2.5vw, 24px); position: relative; z-index: 2; width: 100%; max-width: 40rem; text-shadow: 0 2px 16px rgb(0 0 0 / 30%); }
      .identity { display: flex; align-items: center; gap: var(--identity-gap); }
      .portrait { display: block; flex-shrink: 0; width: var(--portrait-size); height: var(--portrait-size); object-fit: cover; border-radius: 50%; border: 2px solid rgb(255 255 255 / 85%); box-shadow: 0 4px 20px rgb(0 0 0 / 20%); }
      .name { min-width: 0; }
      h1 { margin: 0 0 6px; font-size: clamp(1.875rem, 5vw, 3.75rem); font-weight: 500; letter-spacing: -0.045em; line-height: 1.1; }
      p { margin: 0; font-size: clamp(1rem, 1.5vw, 1.125rem); line-height: 1.7; }
      footer { display: flex; flex-wrap: wrap; align-items: center; gap: 24px; margin-top: 20px; margin-left: calc(var(--portrait-size) + var(--identity-gap)); font-size: 0.875rem; }
      a { color: inherit; padding-block: 12px; text-decoration-thickness: 1px; text-underline-offset: 4px; }
      a:hover { text-decoration-thickness: 2px; }
      a:focus-visible { outline: 2px solid currentColor; outline-offset: 5px; border-radius: 2px; }
      @media (max-height: 480px) {
        body::before { background: rgb(12 9 8 / 60%); }
      }
    </style>
  </head>
  <body>
    <img class="photo" src="hawaii.png" width="1916" height="1443" alt="An orange sunset over the ocean and waves along a beach in Hawaii." decoding="async" fetchpriority="high">
    <main>
      <header class="identity">
        <img class="portrait" src="portrait.png" width="582" height="579" alt="Portrait of Walker Clem" decoding="async">
        <div class="name">
          <h1>Walker Clem</h1>
          <p>Engineer</p>
        </div>
      </header>
      <footer>
        <a href="https://github.com/wclem4" target="_blank" rel="me noopener noreferrer" aria-label="GitHub (opens in a new tab)">GitHub <span aria-hidden="true">↗</span></a>
        <a href="https://www.linkedin.com/in/wclem" target="_blank" rel="me noopener noreferrer" aria-label="LinkedIn (opens in a new tab)">LinkedIn <span aria-hidden="true">↗</span></a>
      </footer>
    </main>
  </body>
</html>
